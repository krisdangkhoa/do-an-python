<form method="get" class="row g-2 align-items-end mb-3">
  <div class="col-auto">
    <label class="form-label small text-muted mb-1">Tháng</label>
    <select name="month" class="form-select form-select-sm" onchange="this.form.submit()">
      <option value="">Cả năm</option>
      {% for v, label in months %}
        <option value="{{ v }}" {% if month == v %}selected{% endif %}>{{ label }}</option>
      {% endfor %}
    </select>
  </div>
  <div class="col-auto">
    <label class="form-label small text-muted mb-1">Năm</label>
    <select name="year" class="form-select form-select-sm" onchange="this.form.submit()">
      {% for y in years %}
        <option value="{{ y }}" {% if year == y %}selected{% endif %}>Năm {{ y }}</option>
      {% endfor %}
    </select>
  </div>
</form>
